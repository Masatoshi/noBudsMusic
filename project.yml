# XcodeGen definition. This file is the source of truth; noBudsMusic.xcodeproj
# is generated from it and is not committed. Run `just generate` after editing.
name: noBudsMusic

options:
  bundleIdPrefix: jp.kaizudenki
  createIntermediateGroups: true
  deploymentTarget:
    # The supported / validated runtime environment is macOS 26.x on Apple
    # Silicon (README.md). The deployment target is lower so the pure-logic
    # module and its tests build on ordinary CI runners.
    macOS: "14.0"
    # The iOS target is a proof of concept only; measured on iOS 27.0.
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing. Releases will need a Developer ID identity; this keeps a
    # local build runnable without one.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # The brief forbids leaving warnings unaddressed.
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  # A static library rather than a framework: nothing needs to be embedded,
  # signed, or versioned separately, and the app stays a single signed bundle.
  NoBudsMusicCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/NoBudsMusicCore
    settings:
      base:
        ENABLE_TESTABILITY: YES

  NoBudsMusic:
    type: application
    platform: macOS
    sources:
      - Sources/NoBudsMusic
      - Sources/NoBudsMusicShared
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ja.lproj
        buildPhase: resources
    dependencies:
      - target: NoBudsMusicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaizudenki.noBudsMusic
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/NoBudsMusic.entitlements
    scheme:
      testTargets:
        - NoBudsMusicCoreTests
      gatherCoverageData: true

  # Proof of concept for ADR 0004. It compiles the Core sources directly rather
  # than linking a second static library: one experiment does not justify making
  # Core multi-platform, and the sources are Foundation-only anyway.
  NoBudsMusicIOS:
    type: application
    platform: iOS
    sources:
      - Sources/NoBudsMusicCore
      - Sources/NoBudsMusicShared
      - Sources/NoBudsMusicIOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
      # Without these, NSLocalizedString returns the key and Control Center and
      # CarPlay show "nowPlaying.title" as the track name.
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/ja.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaizudenki.noBudsMusic.poc
        PRODUCT_NAME: noBudsMusic PoC
        # iOS needs a provisioning profile, so it cannot use the ad-hoc signing
        # the macOS target relies on. These have to be set here rather than
        # passed to xcodebuild: as command-line settings they do not override
        # the manual style declared at project level, and provisioning fails
        # with "No Account for Team".
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 8KS5G58L37
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Needed only by variant 2. Declaring it does not start an audio
        # session; nothing plays until the button is pressed.
        INFOPLIST_KEY_UIBackgroundModes: audio
        TARGETED_DEVICE_FAMILY: "1"

  NoBudsMusicCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NoBudsMusicCoreTests
    dependencies:
      - target: NoBudsMusicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kaizudenki.noBudsMusicCoreTests
        GENERATE_INFOPLIST_FILE: YES
        # A logic-test bundle: no host app, so tests stay fast and need no
        # permissions.
        BUNDLE_LOADER: ""
        TEST_HOST: ""
